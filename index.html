<!doctype html>
<html lang="hr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>e-Knjižnica</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">e-Knjižnica</div>
            <ul class="nav-links">
                <li id="nav-login">
                    <a href="#" onclick="prikaziLogin()">Prijava</a>
                </li>
                <li id="nav-register">
                    <a href="#" onclick="prikaziRegistraciju()">Registracija</a>
                </li>
                <li id="nav-posudbe" style="display: none">
                    <a href="#" onclick="prikaziMojePosudbe()">Moje posudbe</a>
                </li>
                <li id="nav-katalog" style="display: none">
                    <a href="#" onclick="prikaziKatalog()">Katalog</a>
                </li>
                <li id="nav-admin" style="display: none">
                    <a href="#" onclick="prikaziAdmin()">Admin Panel</a>
                </li>
                <li id="nav-logout" style="display: none">
                    <a href="#" onclick="odjaviSe()">Odjava</a>
                </li>
            </ul>
            <div class="user-info" id="user-display" style="display: none">
                Pozdrav, <span id="current-user-name"></span>
            </div>
        </nav>

        <div class="container">
            <div id="view-login" class="auth-container">
                <h2>Prijava</h2>
                <form id="login-form">
                    <input
                        type="email"
                        id="login-email"
                        placeholder="Email"
                        required
                    />
                    <input
                        type="password"
                        id="login-pass"
                        placeholder="Lozinka"
                        required
                    />
                    <button type="submit">Prijavi se</button>
                </form>
            </div>

            <div
                id="view-register"
                class="auth-container"
                style="display: none"
            >
                <h2>Registracija</h2>
                <form id="register-form">
                    <input
                        type="text"
                        id="reg-ime"
                        placeholder="Ime i prezime"
                        required
                    />
                    <input
                        type="email"
                        id="reg-email"
                        placeholder="Email"
                        required
                    />
                    <input
                        type="password"
                        id="reg-pass"
                        placeholder="Lozinka"
                        required
                    />
                    <button type="submit">Registriraj se</button>
                </form>
            </div>

            <div id="view-katalog" style="display: none">
                <h1>Dostupne Knjige</h1>
                <div id="knjige-grid" class="grid"></div>
            </div>

            <div id="view-posudbe" style="display: none">
                <h1>Moje Posudbe</h1>
                <table class="posudbe-table">
                    <thead>
                        <tr>
                            <th>Knjiga</th>
                            <th>Datum Posudbe</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="lista-mojih-posudbi"></tbody>
                </table>
            </div>

            <div id="view-admin" style="display: none">
                <h1>Dodaj Novu Knjigu</h1>
                <form id="add-book-form">
                    <input
                        type="text"
                        id="naslov"
                        placeholder="Naslov knjige"
                        required
                    />
                    <input
                        type="text"
                        id="autor"
                        placeholder="Autor"
                        required
                    />
                    <input
                        type="number"
                        id="kolicina"
                        placeholder="Količina"
                        required
                    />
                    <button type="submit">Spremi u bazu</button>
                </form>
            </div>
        </div>
        <div id="edit-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="zatvoriModal()">&times;</span>
                <h2>Uredi Knjigu</h2>
                <form id="edit-book-form">
                    <input type="hidden" id="edit-id" /> <label>Naslov:</label>
                    <input type="text" id="edit-naslov" required />
                    <label>Autor:</label>
                    <input type="text" id="edit-autor" required />
                    <label>Količina:</label>
                    <input type="number" id="edit-kolicina" required />
                    <button type="submit" class="btn-save">
                        Spremi promjene
                    </button>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
